name: Release candidate artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build RC (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            primary: true
            sbom: false
          - os: macos-15-intel
            target: macos-x64
            primary: false
            sbom: false
          - os: macos-latest
            target: macos-arm64
            primary: false
            sbom: false
          - os: ubuntu-latest
            target: linux-x64-gnu
            primary: false
            sbom: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify coordinated release metadata
        shell: bash
        run: |
          node scripts/verify-release-metadata.mjs
          node -e 'const p=require("./package.json"); if(p.version==="0.0.0") throw new Error("set an RC version before building release artifacts")'

      - name: Build and test release surface
        run: |
          cargo build --release --bin token-shrinker
          pnpm build
          node scripts/verify-native-package.mjs --profile release

      - name: Pack native npm artifact
        run: node scripts/package-native.mjs --output release --profile release

      - name: Pack umbrella npm, SDK, and VSIX
        if: matrix.primary
        shell: pwsh
        run: |
          pnpm --filter @token-shrinker/cli pack --pack-destination release
          pnpm --filter @token-shrinker/sdk pack --pack-destination release
          pnpm --filter ./packages/vscode package
          Copy-Item packages/vscode/dist/token-shrinker.vsix release/token-shrinker.vsix

      - name: Generate CycloneDX SBOM
        if: matrix.sbom
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: release/token-shrinker.cdx.json
          upload-artifact: false

      - name: Write checksums
        run: node scripts/write-checksums.mjs release

      - name: Attest SBOM
        if: matrix.sbom
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/token-shrinker.cdx.json

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-shrinker-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
