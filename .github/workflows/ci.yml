name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.16.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Activate pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks
        run: pnpm check

      - name: Build release binary
        run: cargo build --release --bin token-shrinker

      - name: Enforce performance budgets
        run: cargo run --release -p token-shrinker-cli --example performance_gate

      - name: Generate benchmark artifacts
        run: node scripts/run-demo.mjs
        env:
          TOKEN_SHRINKER_DEMO_OUTPUT: ci-benchmark/public-demo.json
          TOKEN_SHRINKER_RELEASE: "1"

      - name: Verify benchmark artifacts
        run: node scripts/verify-benchmark-artifacts.mjs ci-benchmark/public-demo.json

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: token-shrinker-benchmark-${{ matrix.os }}
          path: ci-benchmark/*
          if-no-files-found: error
          retention-days: 30

      - name: Verify native release package
        run: node scripts/verify-native-package.mjs
        env:
          TOKEN_SHRINKER_PROFILE: release
