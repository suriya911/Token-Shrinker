[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[workspace.dependencies]
criterion = { version = "=0.8.2", default-features = false }
base64 = "=0.23.1"
ed25519-dalek = "=3.0.0"
ignore = "=0.4.33"
interprocess = "=2.4.3"
fs4 = "=1.1.0"
getrandom = "=0.4.3"
r2d2 = "=0.8.10"
r2d2_sqlite = "=0.35.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
semver = "=1.0.28"
sha2 = "=0.11.0"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["parsing"] }
widestring = "=1.2.1"
token-shrinker-types = { path = "crates/ts-types" }
token-shrinker-config = { path = "crates/ts-config" }
token-shrinker-router = { path = "crates/ts-router" }
token-shrinker-context = { path = "crates/ts-context" }
token-shrinker-memory = { path = "crates/ts-memory" }
token-shrinker-repo = { path = "crates/ts-repo" }
token-shrinker-compress = { path = "crates/ts-compress" }
token-shrinker-output = { path = "crates/ts-output" }
token-shrinker-exec = { path = "crates/ts-exec" }
token-shrinker-telemetry = { path = "crates/ts-telemetry" }
token-shrinker-update = { path = "crates/ts-update" }
token-shrinker-protocol = { path = "crates/ts-protocol" }
token-shrinker-daemon = { path = "crates/ts-daemon" }
token-shrinker-mcp = { path = "crates/ts-mcp" }
token-shrinker-provider = { path = "crates/ts-provider" }

[workspace.dependencies.serde_json]
version = "=1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
